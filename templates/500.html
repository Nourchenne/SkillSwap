{% extends 'base.html' %}
{% block title %}Server error - SkillSwap{% endblock %}
{% block content %}
<section class="container" style="max-width:720px;margin:40px auto;">
  <div class="card">
    <div class="card-body" style="text-align:center">
      <h1 class="card-title" style="font-size:28px">Something went wrong</h1>
      <p class="card-text">We had a hiccup processing your request. Our team has been notified.</p>
      <div class="card-actions" style="justify-content:center;margin-top:8px">
        <a class="btn btn-primary" href="/">Go home</a>
        <a class="btn btn-secondary" href="{% url 'skills:browse' %}">Browse skills</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
