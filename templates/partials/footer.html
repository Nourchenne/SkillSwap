<footer class="footer" style="margin-top:24px;border-top:1px solid var(--border);background:#f9fafb">
  <div class="container" style="display:flex;justify-content:space-between;align-items:center;padding:12px 0">
    <div style="display:flex;align-items:center;gap:10px">
      <strong>SkillSwap</strong>
      <span class="card-subtitle">Échanger des compétences, grandir ensemble.</span>
    </div>
    <nav class="footer-links" style="display:flex;gap:14px">
      <a href="{% url 'how_it_works' %}">Comment ça marche</a>
      <a href="{% url 'skills:browse' %}">Parcourir</a>
      <a href="{% url 'accounts:dashboard' %}">Tableau de bord</a>
      {% if request.user.is_authenticated %}
        <a href="{% url 'accounts:profile' request.user.username %}">Profil</a>
      {% else %}
        <a href="{% url 'accounts:login' %}">Se connecter</a>
      {% endif %}
    </nav>
  </div>
  <div class="container" style="padding-bottom:12px">
    <small class="footer-copy" style="color:#6b7280">© {{ now|date:"Y" }} SkillSwap</small>
  </div>
</footer>
