{% load static %}
<header class="nav" role="navigation">
  <!-- Brand Area -->
  <a class="brand" href="{% url 'home' %}" aria-label="SkillSwap Home">
    <img src="{% static 'img/logo.svg' %}" alt="SkillSwap" />
    <span>SkillSwap</span>
  </a>

  <!-- Primary Navigation (Centered) -->
  <nav class="menu" aria-label="Main Navigation">
    <a href="{% url 'skills:browse' %}">Browse</a>
    <a href="{% url 'skills:create_offer' %}">Offer</a>
    <a href="{% url 'accounts:dashboard' %}">Dashboard</a>
    <a href="{% url 'messaging:inbox' %}">Messages</a>
    <a href="{% url 'core:leaderboard' %}">Leaderboard</a>
  </nav>

  <!-- User Actions (Right Aligned) -->
  <div class="actions">
    {% if request.user.is_authenticated %}
    <div class="notif-container">
      <a id="notif-bell" class="btn btn-secondary btn-icon" href="{% url 'core:notifications' %}"
        aria-label="View Notifications">
        🔔
        {% if notifications_count > 0 %}
        <span id="notif-badge" class="badge-count">{{ notifications_count }}</span>
        {% endif %}
      </a>
    </div>

    <a class="btn btn-secondary" href="{% url 'accounts:profile' request.user.username %}">Profile</a>

    <form action="{% url 'accounts:logout' %}" method="post" style="display:inline-block">
      {% csrf_token %}
      <button type="submit" class="btn btn-secondary">Logout</button>
    </form>
    {% else %}
    <a class="btn btn-secondary" href="{% url 'accounts:login' %}">Log in</a>
    <a class="btn btn-primary" href="{% url 'accounts:register' %}">Sign up</a>
    {% endif %}
  </div>
</header>
