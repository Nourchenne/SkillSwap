{% load static %}
<header class="nav" role="navigation">
  <a class="brand" href="{% url 'home' %}" aria-label="SkillSwap home">
    <img src="{% static 'img/logo.svg' %}" alt="SkillSwap" />
    <span>SkillSwap</span>
  </a>
  <button class="menu-toggle" aria-label="Toggle menu" aria-expanded="false">☰</button>
  <nav class="menu" aria-label="Primary">
    <a href="{% url 'skills:browse' %}">Browse Skills</a>
    <a href="{% url 'skills:create_offer' %}">Offer a Skill</a>
    <a href="{% url 'accounts:dashboard' %}">Dashboard</a>
    <a href="{% url 'messaging:inbox' %}">Messages</a>
  </nav>
  <form class="search" action="{% url 'skills:browse' %}" method="get" aria-label="Search skills">
    <input class="input" name="search" type="search" placeholder="Find a skill or mentor…" aria-label="Search" />
    <button class="btn btn-primary" type="submit">Search</button>
  </form>
  <div class="actions">
    {% if request.user.is_authenticated %}
      <a class="btn btn-secondary" href="{% url 'accounts:dashboard' %}" aria-label="View dashboard">Hi, {{ request.user.username }}</a>
      <div class="notif-container">
        <a id="notif-bell" class="btn btn-secondary btn-icon" href="{% url 'core:notifications' %}" aria-label="Notifications" aria-expanded="false">
          🔔
          <span id="notif-badge" class="badge-count" aria-label="{{ notifications_count }} unread" {% if not notifications_count %}hidden{% endif %}>{{ notifications_count }}</span>
        </a>
        <div id="notif-dropdown" class="notif-dropdown" hidden>
          <div class="notif-header">
            <strong>Notifications</strong>
            <button id="notif-mark-all" class="btn btn-link" type="button">Mark all read</button>
          </div>
          <ul id="notif-list" class="notif-list"></ul>
          <div class="notif-footer">
            <a class="btn btn-link" href="{% url 'core:notifications' %}">View all</a>
          </div>
        </div>
      </div>
      <a class="btn btn-primary" href="{% url 'accounts:logout' %}">Log out</a>
    {% else %}
      <a class="btn btn-secondary" href="{% url 'accounts:login' %}">Log in</a>
      <a class="btn btn-primary" href="{% url 'accounts:register' %}">Sign up</a>
    {% endif %}
  </div>
</header>
