{% extends 'base.html' %}
{% block title %}Credits History{% endblock %}
{% block content %}
<h1 class="text-2xl font-bold mb-4">Credit History</h1>
<div class="bg-white rounded-xl p-4">
    <table class="w-full text-left">
        <thead><tr><th>Date</th><th>Change</th><th>Balance</th></tr></thead>
        <tbody>
            {% for tx in transactions %}
            <tr class="border-t"><td>{{ tx.created_at }}</td><td>{{ tx.amount }}</td><td>{{ tx.balance }}</td></tr>
            {% empty %}<tr><td colspan="3">No transactions</td></tr>{% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
