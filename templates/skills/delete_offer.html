{% extends 'base.html' %}
{% block title %}Delete Offer — {{ offer.title }}{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl p-6 text-center">
    <h2 class="text-xl font-bold mb-4">Delete Offer</h2>
    <p class="mb-4">Are you sure you want to delete <strong>{{ offer.title }}</strong>?</p>
    <form method="post">{% csrf_token %}<button class="bg-red-600 text-white px-4 py-2 rounded">Delete</button></form>
</div>
{% endblock %}
