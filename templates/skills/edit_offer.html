{% extends 'base.html' %}
{% block title %}Edit Offer — {{ offer.title }}{% endblock %}
{% block content %}
<div class="container" style="max-width:720px">
    <div class="card">
        <div class="card-body">
            <h2 class="card-title" style="font-size:20px">Edit Offer</h2>
            <form method="post" style="margin-top:10px">{% csrf_token %}
                {{ form.as_p }}
                <div style="display:flex;gap:10px;margin-top:8px">
                    <button class="btn btn-primary" type="submit">Save</button>
                    <a href="{% url 'accounts:dashboard' %}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
