{% extends 'base.html' %}
{% block title %}Request a Skill{% endblock %}
{% block content %}
<div class="container" style="max-width:720px">
    <div class="card">
        <div class="card-body">
            <h2 class="card-title" style="font-size:20px">Request a Skill</h2>
            <form method="post" style="margin-top:10px">
                {% csrf_token %}
                {% include 'includes/form_snippet.html' with submit_text='Create Request' %}
                <div class="mt-4">
                    <a href="{% url 'accounts:dashboard' %}"
                        class="w-full inline-flex justify-center py-2 px-4 border border-gray-300 rounded-xl shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all duration-200">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
