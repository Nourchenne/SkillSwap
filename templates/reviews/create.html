{% extends 'base.html' %}
{% block title %}Leave a Review{% endblock %}
{% block content %}
<div class="container" style="max-width:720px">
    <div class="card">
        <div class="card-body">
            <h2 class="card-title" style="font-size:20px">Leave a Review</h2>
            <form method="post" style="margin-top:10px">{% csrf_token %}
                {{ form.as_p }}
                <button class="btn btn-primary" type="submit" style="margin-top:8px">Submit Review</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
