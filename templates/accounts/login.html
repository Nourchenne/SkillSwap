{% extends 'base.html' %}
{% block title %}Login - SkillSwap{% endblock %}
{% block content %}
<section class="container" style="max-width:560px;margin:0 auto;">
    <div class="card">
        <div class="card-body">
            <h2 class="card-title" style="font-size:24px">Welcome back</h2>
            <form method="post">
                {% csrf_token %}
                <div style="margin-bottom:12px">
                    <label for="id_username" class="card-subtitle">Username</label>
                    <input class="input" type="text" name="username" id="id_username" required>
                </div>
                <div style="margin-bottom:12px">
                    <label for="id_password" class="card-subtitle">Password</label>
                    <input class="input" type="password" name="password" id="id_password" required>
                </div>
                {% if form.errors %}
                    <div class="card" style="border-left:4px solid var(--danger);margin:12px 0">
                        <div class="card-body">
                            <p class="card-text">Invalid username or password. Please try again.</p>
                        </div>
                    </div>
                {% endif %}
                <button type="submit" class="btn btn-primary" style="width:100%">Login</button>
            </form>
            <div style="margin-top:12px" class="card-text">
                <a href="{% url 'accounts:password_reset' %}">Forgot your password?</a>
            </div>
            <div style="margin-top:8px" class="card-text">
                Don't have an account? <a href="{% url 'accounts:register' %}"><strong>Sign up</strong></a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
