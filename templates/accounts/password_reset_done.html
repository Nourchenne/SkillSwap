{% extends 'base.html' %}
{% block title %}Password Reset Sent - SkillSwap{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow p-6">
    <div class="text-center">
        <svg class="mx-auto h-12 w-12 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
        </svg>
        <h2 class="mt-4 text-2xl font-bold">Check your email</h2>
        <p class="mt-2 text-gray-600">We've sent you instructions to reset your password.</p>
        <div class="mt-6">
            <a href="{% url 'accounts:login' %}" class="text-indigo-600 hover:text-indigo-800 font-medium">Back to login</a>
        </div>
    </div>
</div>
{% endblock %}
