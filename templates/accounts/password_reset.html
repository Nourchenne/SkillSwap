{% extends 'base.html' %}
{% block title %}Reset Password - SkillSwap{% endblock %}
{% block content %}
<div class="max-w-md mx-auto bg-white rounded-xl shadow p-6">
    <h2 class="text-2xl font-bold mb-4">Reset your password</h2>
    <p class="text-gray-600 mb-4">Enter your email address and we'll send you a link to reset your password.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="w-full mt-4 bg-indigo-600 text-white px-4 py-2 rounded-lg font-medium hover:bg-indigo-700">
            Send reset link
        </button>
    </form>
    <div class="mt-4 text-center">
        <a href="{% url 'accounts:login' %}" class="text-sm text-indigo-600 hover:text-indigo-800">Back to login</a>
    </div>
</div>
{% endblock %}
