{% extends 'base.html' %}
{% block title %}{{ community.name }} — Community{% endblock %}
{% block content %}
<div class="container">
    <div class="card">
        <div class="card-body">
            <h1 class="card-title" style="font-size:22px">{{ community.name }}</h1>
            <p class="card-text">{{ community.description }}</p>
            <div style="margin-top:12px">
                <h3 class="section-title" style="margin:0 0 8px">Members</h3>
                <div class="card" style="padding:12px">
                    <ul style="margin:0; padding-left:18px">
                        {% for m in members %}
                            <li>{{ m.username }}</li>
                        {% empty %}
                            <li class="card-subtitle">No members</li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
